<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🤖 Fatura AI — Agent Dashboard</title>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet"
  />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --border:    #30363d;
      --text:      #c9d1d9;
      --muted:     #8b949e;
      --accent-aider:       #58a6ff;
      --accent-claude:      #bc8cff;
      --accent-opencode:    #3fb950;
      --accent-orchestrator:#f0883e;
      --header-h:  56px;
      --status-h:  36px;
      --font:      'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
    }

    /* ── top header ── */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--header-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 12px;
      z-index: 100;
    }

    header h1 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.02em;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent-opencode);
      box-shadow: 0 0 6px var(--accent-opencode);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    .legend {
      display: flex;
      gap: 16px;
      margin-left: auto;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 11px;
    }
    .legend-dot {
      width: 10px; height: 10px;
      border-radius: 2px;
    }

    /* ── grid ── */
    main {
      position: fixed;
      top: var(--header-h);
      bottom: var(--status-h);
      left: 0; right: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 8px;
      padding: 8px;
    }

    @media (max-width: 800px) {
      main {
        grid-template-columns: 1fr;
        grid-template-rows: repeat(4, 1fr);
      }
    }

    /* ── terminal panel ── */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-left-width: 3px;
    }
    .panel[data-label="Aider"]        { border-left-color: var(--accent-aider); }
    .panel[data-label="Claude Code"]  { border-left-color: var(--accent-claude); }
    .panel[data-label="OpenCode"]     { border-left-color: var(--accent-opencode); }
    .panel[data-label="Orchestrator"] { border-left-color: var(--accent-orchestrator); }

    .panel-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(0,0,0,0.25);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .panel-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .panel[data-label="Aider"]        .panel-badge { background: rgba(88,166,255,0.15); color: var(--accent-aider); }
    .panel[data-label="Claude Code"]  .panel-badge { background: rgba(188,140,255,0.15); color: var(--accent-claude); }
    .panel[data-label="OpenCode"]     .panel-badge { background: rgba(63,185,80,0.15);  color: var(--accent-opencode); }
    .panel[data-label="Orchestrator"] .panel-badge { background: rgba(240,136,62,0.15); color: var(--accent-orchestrator); }

    .panel-title {
      color: var(--muted);
      font-size: 11px;
    }
    .panel-win {
      margin-left: auto;
      font-size: 10px;
      color: var(--border);
    }

    .panel-content {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
    }
    .panel-content::-webkit-scrollbar { width: 4px; }
    .panel-content::-webkit-scrollbar-track { background: transparent; }
    .panel-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .panel-content pre {
      font-family: var(--font);
      font-size: 11.5px;
      line-height: 1.55;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-all;
    }

    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--muted);
      font-size: 12px;
      gap: 8px;
    }

    /* ── status bar ── */
    footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: var(--status-h);
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 16px;
      color: var(--muted);
      font-size: 11px;
    }
    .status-sep { color: var(--border); }
    #status-time { color: var(--text); }
    #status-count { color: var(--accent-opencode); }
    .error-pill {
      margin-left: auto;
      background: rgba(240,80,60,0.15);
      color: #ff6b6b;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      display: none;
    }
    .error-pill.visible { display: block; }
  </style>
</head>
<body>

<header>
  <div class="dot"></div>
  <h1>🤖 Fatura AI — Agent Dashboard</h1>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--accent-aider)"></div>Aider</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--accent-claude)"></div>Claude Code</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--accent-opencode)"></div>OpenCode</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--accent-orchestrator)"></div>Orchestrator</div>
  </div>
</header>

<main id="grid">
  <!-- populated by JS -->
  <div class="empty-state" style="grid-column:1/-1">
    <span>⏳ Connecting to Terminal.app…</span>
  </div>
</main>

<footer>
  <span>Last updated:</span>
  <span id="status-time">—</span>
  <span class="status-sep">·</span>
  <span id="status-count">0</span>
  <span>windows detected</span>
  <span id="error-pill" class="error-pill">AppleScript error</span>
</footer>

<script>
  const grid = document.getElementById('grid');
  const statusTime = document.getElementById('status-time');
  const statusCount = document.getElementById('status-count');
  const errorPill = document.getElementById('error-pill');

  // Track scroll state per panel — only auto-scroll if already at bottom
  const scrollState = {};

  function isNearBottom(el) {
    return el.scrollHeight - el.scrollTop - el.clientHeight < 60;
  }

  function scrollToBottom(el) {
    el.scrollTop = el.scrollHeight;
  }

  function labelFromContent(content) {
    const c = content.toLowerCase();
    if (c.includes('aider'))                  return 'Aider';
    if (c.includes('opencode') || c.includes('open code')) return 'OpenCode';
    if (c.includes('claude') || content.includes('❯'))     return 'Claude Code';
    return 'Orchestrator';
  }

  function buildPanel(win) {
    const panel = document.createElement('div');
    panel.className = 'panel';
    panel.dataset.label = win.label;
    panel.dataset.win = win.window;

    panel.innerHTML = `
      <div class="panel-header">
        <span class="panel-badge">${escHtml(win.label)}</span>
        <span class="panel-title">Terminal Window</span>
        <span class="panel-win">#${win.window}</span>
      </div>
      <div class="panel-content" id="content-${win.window}">
        <pre>${escHtml(win.content)}</pre>
      </div>
    `;
    return panel;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function pad2(n) { return String(n).padStart(2, '0'); }

  function nowStr() {
    const d = new Date();
    return `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
  }

  let lastWindowIds = null;

  async function refresh() {
    try {
      const resp = await fetch('/api/terminals');
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const windows = await resp.json();

      errorPill.classList.remove('visible');
      statusCount.textContent = windows.length;
      statusTime.textContent = nowStr();

      const ids = windows.map(w => w.window).join(',');

      if (ids !== lastWindowIds) {
        // Rebuild grid when window set changes
        lastWindowIds = ids;
        grid.innerHTML = '';

        if (windows.length === 0) {
          grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1">⚠️ No Terminal windows detected</div>';
          return;
        }

        // Show up to 4 panels in 2×2 grid
        const shown = windows.slice(0, 4);
        shown.forEach(win => {
          grid.appendChild(buildPanel(win));
          scrollState[win.window] = true; // start scrolled to bottom
        });

        shown.forEach(win => {
          const el = document.getElementById(`content-${win.window}`);
          if (el) scrollToBottom(el);
        });
      } else {
        // Update content in place
        windows.slice(0, 4).forEach(win => {
          const el = document.getElementById(`content-${win.window}`);
          if (!el) return;
          const atBottom = isNearBottom(el);
          const pre = el.querySelector('pre');
          if (pre) pre.textContent = win.content;
          if (atBottom) scrollToBottom(el);

          // Update label if it changed
          const panel = el.closest('.panel');
          if (panel && panel.dataset.label !== win.label) {
            panel.dataset.label = win.label;
            const badge = panel.querySelector('.panel-badge');
            if (badge) badge.textContent = win.label;
          }
        });
      }
    } catch (err) {
      errorPill.classList.add('visible');
      statusTime.textContent = nowStr();
      console.error('Dashboard refresh error:', err);
    }
  }

  refresh();
  setInterval(refresh, 2000);
</script>
</body>
</html>
